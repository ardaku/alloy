[package]
name = "alloy"
version = "1.0.0"
description = "A fast and minimalistic image viewer based on emulsion"
repository = "https://github.com/ardaku/alloy"
license = "MIT"
readme = "README.md"
edition = "2024"
build = "build.rs"

[package.metadata.bundle]
name = "Alloy"
identifier = "org.ardaku.alloy"
icon = ["resource_dev/alloy.png"]
resources = ["LICENSE.txt"]
short_description = "A lightweight and minimalistic image viewer based on emulsion"
copyright = "Copyright (c) 2020 The Emulsion Contributors, Copyright (c) 2022-2024 The Alloy Contributors"
linux_exec_args = "%f"
linux_mime_types = [
    "image/jpeg",
    "image/jpg",
    "image/pjpeg",
    "image/png",
    "image/apng",
    "image/gif",
    "image/webp",
    "image/tiff",
    "image/bmp",
    "image/avif",
    "image/svg+xml",
    "image/svg",
    "image/x-png",
    "image/x-tga",
    "image/x-targa",
    "image/x-bmp",
    "image/x-icon",
    "image/vnd.microsoft.icon",
    "image/vnd.radiance",
    "image/x‑portable‑bitmap",
    "image/x‑portable‑graymap",
    "image/x‑portable‑pixmap",
    "image/x‑portable‑anymap"
]

[target.'cfg(windows)'.build-dependencies]
winres = "0.1"

[dependencies]
arboard = "3.6.1"
backtrace = "0.3.76"
cgmath = "0.18.0"
directories = "6.0.0"
env_logger = "0.11.8"
glium = "0.32.1"
image = "0.25.8"
kamadak-exif = "0.6.1"
lazy_static = "1.5.0"
lexical-sort = "0.3.1"
log = "0.4.28"
open = "5.3.2"
pico-args = "0.5.0"
rand = "0.9.2"
resvg = "0.45.1"
serde = { version = "1.0.227", features = ["derive"] }
thiserror = "2.0.16"
tiny-skia = "0.11.4"
toml = "0.9.7"
trash = { version = "5.2.3", default-features = false }
typed-builder = "0.22.0"
usvg = "0.45.1"
winit = "0.28.7"
