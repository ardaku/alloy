[graph]
no-default-features = false
all-features = false

[output]
feature-depth = 1

[advisories]
version = 2
db-path = "~/.cargo/advisory-db"
db-urls = ["https://github.com/rustsec/advisory-db"]
yanked = "deny"
ignore = [
    # instant is unmaintained: https://rustsec.org/advisories/RUSTSEC-2024-0384
    #
    # Will move off winit which pulls it in eventually, so it's ok to allow for
    # now
    "RUSTSEC-2024-0384",
    # paste is unmaintained: https://rustsec.org/advisories/RUSTSEC-2024-0436
    #
    # Requires rav1e to remove as dependency
    "RUSTSEC-2024-0436",
]

[licenses]
version = 2
allow = [
    "Apache-2.0",
    "Apache-2.0 WITH LLVM-exception",
    "BSD-2-Clause",
    "BSD-3-Clause",
    "BSL-1.0",
    "CC0-1.0",
    "ISC",
    "MIT",
    "MPL-2.0",
    "NCSA",
    "Unicode-3.0",
    "Zlib",
]
confidence-threshold = 1.0
exceptions = []

#[[licenses.clarify]]
#name = "ring"
#version = "*"
#expression = "MIT AND ISC AND OpenSSL"
#license-files = [
    # Each entry is a crate relative path, and the (opaque) hash of its contents
    #{ path = "LICENSE", hash = 0xbd0eed23 }
#]

[licenses.private]
ignore = false
registries = []

[bans]
multiple-versions = "deny"
wildcards = "deny"
highlight = "all"
workspace-default-features = "deny"
external-default-features = "allow" # for now
